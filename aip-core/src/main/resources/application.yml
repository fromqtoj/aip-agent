    path: /Users/qijian/Desktop/爱化身/aip-agent/logs

spring:
  application:
    name: aip-core
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-1e62ec4aa62943709062e161230e191c}

    memory:
      redis:
        host: 39.105.37.222
        port: 16379
