        timeout:  5000

aip:
  agent:
    # ========================= 切换说明（只改下面两行） =========================
    # 原始 Agent（Spring AI + MCP）:
    #   active: mcp
    #   claude-code-cli.enabled: false
    #
    # Claude Code Agent:
    #   active: claude-code-cli
    #   claude-code-cli.enabled: true
    #
    # 你只需要改这两个键：
    # 1) active
    # 2) claude-code-cli.enabled
    # ======================================================================
    active: claude-code-cli
    claude-code-cli:
      enabled: true
      command-template:
        - claude
        - -p
        - "{prompt}"
      timeout-seconds: 180
      working-directory: /Users/qijian/Desktop/爱化身/aip-agent
      append-prompt-when-missing: true
      allowed-export-root: /Users/qijian/Desktop/爱化身
      environment: {}
    skill:
      enabled: true
      path: ./aip-core/skills
      max-matched: 3
  mcp:
    server:
      api-prefix: /mcp/server
    client:
      base-url: http://127.0.0.1:10667
